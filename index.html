.twd{position:absolute;height:0;border-top:1.5px dashed var(--ac);pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}
.twd.on{opacity:.9}
.twp{position:absolute;width:40px;height:24px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;color:var(--ac);z-index:5;touch-action:none}
.twp:hover,.twp.hot{color:var(--al);filter:drop-shadow(0 0 3px var(--ac))}
html.ph #twb{display:none}
#fpk{position:fixed;display:none;z-index:50;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px;grid-template-columns:repeat(5,26px);gap:4px}
#fpk button{height:26px;border-radius:5px;border:2px solid transparent;cursor:pointer}
#fpk button.cur{border-color:var(--tx)}
/* 手機簡易版 */
html.ph,html.ph body{height:100dvh}
html.ph body{padding:8px}
html.ph .app{grid-template-columns:minmax(0,1fr) auto!important;grid-template-rows:auto auto 34px auto 34px auto minmax(0,1fr)!important;row-gap:6px;column-gap:6px}
html.ph #logo{grid-column:1!important;grid-row:1!important;align-self:start!important}
html.ph #logo svg{width:200px;pointer-events:none}
html.ph #ver{left:190px!important;top:10px!important}
html.ph #tr{grid-column:2!important;grid-row:1!important}
html.ph #tr>div:first-child{display:none}
html.ph #tr .row>:not(#cpb){display:none!important}

html.ph #phn{grid-column:1/-1;grid-row:2;font-size:13px;line-height:1.45;color:var(--al);padding:2px 4px 2px 58px;align-self:center}
html.ph #sysmsg:has(.ln)~#phn{visibility:hidden}
html.ph #sysmsg{grid-column:1/-1;grid-row:2;margin-right:0;height:46px}
html.ph #sysmsg .ln{left:58px;right:4px;white-space:normal}
html.ph #r2{grid-column:1/-1!important;grid-row:3!important;align-items:center}
html.ph #ths{margin-left:0}
html.ph #phbag{display:flex;align-items:center;gap:4px;margin-left:auto;height:34px}
html.ph #lst{grid-column:1/-1!important;grid-row:4!important}
html.ph #top{flex:none;max-height:140px;min-height:0}
html.ph #arc{flex:1 1 auto;min-height:40px}
html.ph #fdz,html.ph #fh,html.ph #frows,html.ph #fcol,html.ph #ftab,html.ph #fpg{display:none!important}

html.ph #wc{grid-column:1/-1;grid-row:6;justify-self:end;align-self:center;margin-left:0!important}

let AC=null,MG=null,NB=null,DL=null,DG=null,voices=0;const VOL=[0,.3,1],rr=(a,b)=>a+Math.random()*(b-a);
function actx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);
    DL=AC.createDelay(1);DL.delayTime.value=.17;const fb=AC.createGain();fb.gain.value=.38;DL.connect(fb);fb.connect(DL);DG=AC.createGain();DG.gain.value=1;DL.connect(DG);DG.connect(MG)}
  if(AC.state==='suspended')AC.resume();
  MG.gain.value=VOL[S.sfx]||0;return AC;
}
// ---------- 音階鎖定 ----------
const PENT=[0,2,4,7,9];
function snap(f){if(f<70||f>5000)return f;const m=69+12*Math.log2(f/440),o=Math.floor(m/12),pc=m-o*12;let best=0,bd=99;for(const p of PENT.concat([12])){const d=Math.abs(pc-p);if(d<bd){bd=d;best=p}}return 440*Math.pow(2,(o*12+best-69)/12)}
const semi=f=>Math.round(69+12*Math.log2(f/440)),mf=m=>440*Math.pow(2,(m-69)/12);
function pickPent(lo,hi){const a=[];for(let m=semi(lo);m<=semi(hi);m++)if(PENT.includes(((m%12)+12)%12))a.push(mf(m));return a[Math.floor(Math.random()*a.length)]}
// ---------- 引擎 ----------
const PK={};
function mkPack(id,cfg){PK[id]=Object.assign({id,semi:0,lp:1,dec:1,vol:1,snap:false,sp:0},cfg);return PK[id]}
function baseTone(P,f,d,o){const c=AC;if(voices>26)return;o=o||{};const t=c.currentTime+(o.at||0);
  let f1=f*Math.pow(2,P.semi/12),f2=o.to?o.to*Math.pow(2,P.semi/12):0;if(P.snap){f1=snap(f1);if(f2)f2=snap(f2)}
  const dd=d*P.dec,v=(o.v||.15)*P.vol,g=c.createGain(),type=P.mapType?P.mapType(o.type||'sine'):(o.type||'sine');
  let out=g;const parts=P.partials?P.partials(type):[{type,r:1,g:1}];
  if(P.filter){const fl=c.createBiquadFilter();fl.type='lowpass';const top=P.filter.f*P.lp;fl.frequency.setValueAtTime(top,t);fl.frequency.exponentialRampToValueAtTime(Math.max(200,top*(P.filter.end||1)),t+dd);fl.Q.value=P.filter.q||1;g.connect(fl);out=fl}
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||P.att||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dd);
  parts.forEach(pt=>{const x=c.createOscillator(),pg=c.createGain();x.type=pt.type;pg.gain.value=pt.g;if(pt.det)x.detune.value=pt.det;
    x.frequency.setValueAtTime(f1*pt.r,t);if(f2){if(P.step){const n=P.step,arr=new Float32Array(n);for(let i=0;i<n;i++)arr[i]=mf(Math.round(semi(f1)+(semi(f2)-semi(f1))*(i/(n-1))))*pt.r;x.frequency.setValueCurveAtTime(arr,t,dd)}else x.frequency.exponentialRampToValueAtTime(f2*pt.r,t+dd)}
    if(P.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.value=P.vib;l.connect(lg);lg.connect(x.detune);l.start(t);l.stop(t+dd+.03)}
    x.connect(pg);pg.connect(g);x.start(t);x.stop(t+dd+.03);voices++;x.onended=()=>voices--});
  out.connect(MG);if(P.sp&&DL){const s=c.createGain();s.gain.value=P.sp;out.connect(s);s.connect(DL)}}
function baseNoise(P,d,o){const c=AC;if(voices>26)return;o=o||{};const t=c.currentTime+(o.at||0),v=(o.v||.15)*P.vol*(P.nv||1);
  if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const dd=d*P.dec*(P.nd||1),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=NB;s.loop=true;
  let ft=o.ft||'lowpass',fq=(o.f||1000)*(P.nf||1)*(ft==='lowpass'?P.lp:1);f.type=ft;f.frequency.setValueAtTime(fq,t);if(o.to)f.frequency.exponentialRampToValueAtTime((o.to)*(P.nf||1),t+dd);f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dd);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random());s.stop(t+dd+.03);voices++;s.onended=()=>voices--}
// ---------- 新：揉紙（24）引擎 ----------
// 不再是一整團噪音「啪」一下，而是：幾波手指收緊的節奏 × 很多細小的紙纖維爆裂聲，底下墊一層很輕的沙沙聲；
// 低頻全部切掉，所以不會有巴掌或鐵盒的「身體」。
// o 參數：d 長度、dens 每秒爆裂數、cl 收緊幾波、gmin/gmax 單顆爆裂長短、bed 沙沙底噪、hp/lp 濾波、bits/hold 八位元化、v 音量
function baseCrumple(P,o){const c=AC;if(voices>26)return;o=o||{};const sr=c.sampleRate,dur=(o.d||.5)*P.dec,n=Math.max(64,Math.floor(sr*dur)),buf=c.createBuffer(1,n,sr),a=buf.getChannelData(0);
  const cl=o.cl||3,cen=[];for(let k=0;k<cl;k++)cen.push(rr(.08,.85));
  const ev=Math.round((o.dens||110)*dur);
  for(let e=0;e<ev;e++){let pos=o.skew?Math.pow(Math.random(),o.skew)*.95:cen[Math.floor(Math.random()*cl)]+(Math.random()+Math.random()-1)*.12;pos=Math.min(.97,Math.max(.03,pos));
    const p=Math.floor(pos*n),amp=Math.pow(Math.random(),1.6),len=Math.floor(sr*rr(o.gmin||.0015,o.gmax||.009)),tau=len*rr(.15,.4);
    for(let i=0;i<len&&p+i<n;i++)a[p+i]+=(Math.random()*2-1)*amp*Math.exp(-i/tau)}
  const bed=o.bed==null?.07:o.bed;for(let i=0;i<n;i++){const x=i/n,env=o.env==='decay'?Math.min(1,x*40)*Math.exp(-x*4):Math.pow(Math.sin(Math.PI*Math.min(1,x*1.15)),2);a[i]+=(Math.random()*2-1)*bed*env}
  if(o.bits){const q=Math.pow(2,o.bits-1),h=o.hold||4;let last=0;for(let i=0;i<n;i++){if(i%h===0)last=Math.round(a[i]*q)/q;a[i]=last}}
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(a[i]));if(pk>0)for(let i=0;i<n;i++)a[i]/=pk;
  const fi=Math.floor(sr*.008);for(let i=0;i<fi&&i<n/2;i++){a[i]*=i/fi;a[n-1-i]*=i/fi}
  const s=c.createBufferSource();s.buffer=buf;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=o.hp||1300;hp.Q.value=.6;
  const lp=c.createBiquadFilter();lp.type='lowpass';const t0=c.currentTime+(o.at||0),lf=Math.min(16000,(o.lp||8000)*P.lp);lp.frequency.setValueAtTime(lf,t0);if(o.lpTo)lp.frequency.exponentialRampToValueAtTime(o.lpTo,t0+dur);const g=c.createGain();g.gain.value=(o.v||.32)*P.vol;
  s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(MG);if(P.sp&&DL){const sd=c.createGain();sd.gain.value=P.sp;g.connect(sd);sd.connect(DL)}
  s.start(c.currentTime+(o.at||0));voices++;s.onended=()=>voices--}

// 基底事件表（R note 原本的全部聲音；tone / noise / cr 由各組引擎代入）
function SFXF(tone,noise,cr){const SFX={
  // 打字
  key:()=>{tone(rr(1500,2100),.035,{type:'square',v:.05});if(S.fx.chips)noise(.03,{ft:'highpass',f:3500,v:.05})},
  commit:()=>{tone(880,.07,{type:'triangle',v:.09});tone(1318,.1,{type:'triangle',v:.08,at:.035})},   // 中文（輸入法）字送出
  nav:()=>tone(rr(700,800),.02,{type:'square',v:.03}),
  del:()=>tone(320,.07,{type:'triangle',v:.07,to:160}),
  enter:()=>{tone(1500,.03,{type:'square',v:.05});tone(200,.09,{type:'triangle',v:.1,to:140,at:.01})},
  paste:()=>{noise(.3,{f:700,to:120,v:.35});tone(90,.28,{v:.3,to:45})},                            // 大量貼上（落石）
  // 按鈕與介面
  ui:()=>tone(1250,.03,{type:'square',v:.05}),
  tick:()=>tone(900,.02,{type:'square',v:.035}),
  clear:()=>tone(700,.05,{type:'triangle',v:.06,to:450}),
  search:()=>{tone(1175,.06,{v:.1});tone(1760,.09,{v:.08,at:.05})},
  new:()=>tone(520,.09,{type:'triangle',v:.12,to:880}),
  copy:()=>{tone(1400,.03,{type:'square',v:.05});tone(1800,.03,{type:'square',v:.05,at:.05})},
  date:()=>{tone(1000,.03,{type:'square',v:.05});tone(1500,.04,{type:'square',v:.05,at:.045})},
  help:()=>tone(660,.12,{type:'triangle',v:.1,to:990}),
  export:()=>{tone(500,.18,{type:'triangle',v:.1,to:1100});noise(.15,{ft:'bandpass',f:800,to:2500,v:.05})},
  import:()=>{tone(1100,.18,{type:'triangle',v:.1,to:500});noise(.15,{ft:'bandpass',f:2500,to:800,v:.05})},
  theme:k=>{const f={d:[1047,1568],u:[698,880],n:[523,392]}[k]||[800,800];tone(f[0],.1,{v:.1});tone(f[1],.16,{v:.09,at:.06})},
  pick:()=>{tone(1320,.05,{type:'triangle',v:.1});tone(1760,.08,{type:'triangle',v:.08,at:.04})},
  archive:()=>{noise(.12,{f:500,to:150,v:.2});tone(140,.12,{v:.18,to:70})},
  restore:()=>tone(300,.14,{type:'triangle',v:.1,to:700}),
  lock:()=>{tone(700,.025,{type:'square',v:.07});tone(420,.06,{type:'square',v:.07,at:.04})},
  crumple:()=>noise(.35,{ft:'bandpass',f:2500,to:600,q:.7,v:.22}),
  err:()=>{tone(180,.14,{type:'sawtooth',v:.08});tone(150,.18,{type:'sawtooth',v:.08,at:.12})},
  vol:()=>{tone(880,.06,{type:'triangle',v:.12});tone(1320,.08,{type:'triangle',v:.1,at:.05})},
  clock:()=>{tone(1600,.02,{type:'square',v:.05});tone(1100,.03,{type:'square',v:.05,at:.05})},
  // LOGO 字母：o.on 為開、關
  logo:o=>{const on=o.on,u=(a,b)=>on?[a,b]:[b,a];
    if(o.k=='R'){const f=u(160,240);tone(f[0],.14,{type:'square',v:.08,to:f[1]});noise(.04,{ft:'highpass',f:2500,v:.05})}
    else if(o.k=='o'){const f=u(330,495);tone(f[0],.28,{v:.14,a:.08,to:f[1]})}
    else if(o.k=='t'){noise(.1,{f:900,v:.2});const f=u(120,70);tone(f[0],.14,{v:.2,to:f[1]})}
    else if(o.k=='e'){const b=on?1040:780;tone(b,.12,{type:'triangle',v:.1});tone(b*1.5,.16,{type:'triangle',v:.08,at:.04});noise(.03,{ft:'highpass',f:4000,v:.06})}
    else{noise(.22,{ft:'bandpass',f:on?400:1400,to:on?1400:400,q:1.2,v:.12});tone(on?262:392,.1,{type:'triangle',v:.06,at:.1,to:on?392:262})}},
  // 挖礦：礦越稀有（i 越小）音越亮、越長
  gem:i=>{const b=2300-i*140,n=i<=4?3:i<=7?2:1,r=[1,1.26,1.5];for(let k=0;k<n;k++)tone(b*r[k],.18,{v:.09,at:k*.05});if(i==0)noise(.25,{ft:'highpass',f:6000,v:.05,at:.1})},
  coin:n=>{const k=Math.min(6,2+Math.ceil(Math.log2((n||1)+1)));for(let i=0;i<k;i++)tone(1568*(1+i*.07),.12,{type:'square',v:.05,at:i*.045});tone(2349,.2,{v:.06,at:k*.045})},
  wc100:()=>{tone(400,.35,{v:.04,to:1800});tone(1568,.5,{type:'triangle',v:.12,at:.05});tone(2349,.6,{type:'triangle',v:.09,at:.11});tone(3136,.7,{v:.06,at:.17});noise(.4,{ft:'highpass',f:5000,v:.06,at:.1})},
  hour:()=>{tone(1046,.9,{v:.1});tone(1568,.7,{v:.07,at:.02});tone(2093,.5,{v:.04,at:.04})},
  // 未來功能預留（尚未接上）：十字鎬升級、購買、解鎖
  upgrade:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.14,{type:'triangle',v:.1,at:k*.07})),
  buy:()=>{tone(1319,.08,{type:'square',v:.06});tone(1760,.14,{type:'square',v:.06,at:.07})},
  unlock:()=>{SFX.lock();[784,1047,1568].forEach((f,k)=>tone(f,.16,{v:.09,at:.1+k*.06}))}
};
return SFX}
// ---------- 六組 ----------
mkPack('R',{name:'R 預設（目前 R note 使用的音效）',desc:'不動，就是現在這一版；只有 24 刪除特效換成新寫法（燃燒）。'});
mkPack('N',{name:'N 機械木質',desc:'鍵盤的悶響、木魚與低音木琴；高頻壓弱、音域下沉。',semi:-12,snap:true,dec:.85,
  mapType:t=>t==='sine'?'sine':'triangle',partials:t=>[{type:t,r:1,g:1},{type:'sine',r:2,g:.22}],filter:{f:1900,end:.5,q:1},att:.003});
mkPack('O',{name:'O 八位元',desc:'方波、三角波、階梯式音高，舊掌機的短促。',semi:0,dec:.8,
  mapType:t=>t==='sawtooth'?'square':t==='sine'?'triangle':t,step:5,nv:.8,nd:.6,nf:1.5});
mkPack('T',{name:'T 賽博龐克',desc:'失諧鋸齒波、濾波器掃頻、尾巴帶回音。',semi:-5,snap:false,dec:1.05,
  mapType:()=>'sawtooth',partials:t=>[{type:'sawtooth',r:1,g:.6,det:-9},{type:'sawtooth',r:1,g:.6,det:9}],filter:{f:5200,end:.14,q:6},nf:1.3,sp:.28});
mkPack('E',{name:'E 草原',desc:'輕柔的撥弦與笛聲，帶一點顫音，像風吹過草地。',semi:0,snap:true,dec:1.3,vol:.9,
  mapType:t=>t==='square'||t==='sawtooth'?'triangle':t,partials:t=>[{type:t,r:1,g:1},{type:'sine',r:2,g:.25},{type:'sine',r:3.01,g:.1}],vib:6,att:.01,nv:.5,nf:.7});
mkPack('G',{name:'G 水晶玻璃（預留・篩選／隱藏版）',desc:'杯緣輕敲、水晶風鈴：非整數倍泛音、清透長尾、一點殘響。',semi:0,snap:true,dec:1.5,vol:.85,
  mapType:()=>'sine',partials:()=>[{type:'sine',r:1,g:1},{type:'sine',r:2.76,g:.38},{type:'sine',r:5.40,g:.16},{type:'sine',r:8.93,g:.06}],att:.002,sp:.16,nv:.45,nf:1.6});

// 調音工作台調好的參數
Object.assign(PK.N,{semi:-10,lp:.6,dec:1.05,vol:.95,snap:true});
Object.assign(PK.O,{semi:2,lp:.9,dec:1.25,vol:.95,snap:false});
Object.assign(PK.T,{semi:-6,lp:.7,dec:.7,vol:.95,snap:false,sp:.10});
Object.assign(PK.E,{semi:-3,lp:.75,dec:1.2,vol:.9,snap:true,vib:16});
// ---------- 各組特色事件 ----------
function build(id){const P=PK[id],T=(f,d,o)=>baseTone(P,f,d,o),N=(d,o)=>baseNoise(P,d,o),C=o=>baseCrumple(P,o),K=(sec,vol,o)=>C(Object.assign({d:sec/P.dec,v:vol/P.vol},o)),TT=(f,d,o)=>{o=Object.assign({},o);o.v=(o.v||.15)/P.vol;T(f,d/P.dec,o)};
  const sfx=SFXF(T,N,C);
  if(id==='R'){sfx.crumple=()=>K(.35,.22,{hp:500,lp:3800,dens:55,skew:1.8,env:'decay',bed:.12,gmax:.004,lpTo:1500});return sfx} // 燃燒：紙邊小火花
  if(id==='N'){
    sfx.key=()=>{N(.05,{ft:'bandpass',f:rr(260,380),q:2,v:.28});T(rr(180,260),.07,{v:.2,to:rr(110,140)});N(.012,{ft:'highpass',f:2500,v:.05})};
    sfx.commit=()=>{const f=pickPent(330,660);T(f,.3,{v:.16});T(f*3.9,.07,{v:.05});T(f*1.5,.24,{v:.1,at:.05})};
    sfx.enter=()=>{N(.07,{ft:'bandpass',f:200,q:1.5,v:.3});T(150,.12,{v:.22,to:80})};
    sfx.del=()=>{N(.04,{ft:'bandpass',f:420,q:2,v:.18});T(210,.06,{v:.12,to:130})};
    sfx.crumple=()=>{for(let i=0;i<6;i++)TT(rr(200,420),.07,{type:'triangle',v:.15*(1-i*.13),at:i*.045+rr(0,.012),to:rr(110,160)});K(.3,.1,{hp:400,lp:2400,dens:40,skew:1.4,env:'decay',bed:.06,at:.02})};            // 牛皮紙：厚、悶、顆粒大
  }else if(id==='O'){
    sfx.key=()=>T(pickPent(660,1500),.03,{type:'square',v:.05});
    sfx.commit=()=>{T(659,.05,{type:'square',v:.07});T(988,.08,{type:'square',v:.07,at:.05})};
    sfx.del=()=>T(220,.06,{type:'square',v:.06,to:110});
    sfx.crumple=()=>{K(.235,.17,{hp:300,lp:3500,bits:3,hold:5,dens:300,gmax:.008,env:'decay',bed:.2,lpTo:700});TT(160,.2,{type:'square',v:.07,to:40})};                // 降解析度的揉紙
  }else if(id==='T'){
    sfx.key=()=>{T(rr(1500,2400),.03,{type:'sawtooth',v:.045});N(.02,{ft:'bandpass',f:6500,q:8,v:.04})};
    sfx.commit=()=>{T(587,.12,{v:.09,to:1175});T(880,.16,{v:.08,at:.06})};
    sfx.del=()=>{T(400,.08,{v:.08,to:140});N(.04,{ft:'highpass',f:5000,v:.04})};
    sfx.crumple=()=>{K(.33,.14,{hp:700,lp:4500,dens:90,bits:4,hold:3,env:'decay',skew:1.2,lpTo:1200});TT(900,.3,{type:'sawtooth',v:.05,to:120});[0,.08,.17].forEach(a=>TT(rr(400,900),.04,{type:'square',v:.03,at:a}))};                       // 錫箔／塑膠包裝，尾巴吃回音
  }else if(id==='E'){
    sfx.key=()=>{const f=pickPent(523,1568);T(f,.2,{type:'triangle',v:.07});T(f*4.2,.05,{type:'sine',v:.025})};
    sfx.commit=()=>{const f=pickPent(523,880);T(f,.4,{v:.12});T(f*1.5,.5,{v:.1,at:.07})};
    sfx.del=()=>T(330,.12,{type:'sine',v:.07,to:250});
    sfx.crumple=()=>K(.455,.15,{hp:900,lp:3800,dens:30,bed:.3,gmax:.003,lpTo:1800});                      // 乾葉子在手裡碎掉
  }else if(id==='G'){
    sfx.key=()=>T(pickPent(1568,2637),.14,{v:.04});
    sfx.commit=()=>{const f=pickPent(1046,1568);T(f,.5,{v:.08});T(f*1.5,.5,{v:.06,at:.04})};
    sfx.enter=()=>{T(523,.7,{v:.1});T(784,.6,{v:.05,at:.02})};
    sfx.del=()=>T(1760,.18,{v:.05,to:1318});
    sfx.ui=()=>T(2093,.1,{v:.05});
    sfx.crumple=()=>{K(.2,.1,{hp:2500,lp:6500,dens:120,skew:2.5,env:'decay',bed:.02,gmax:.003});for(let i=0;i<5;i++)TT(pickPent(2093,4186),.22,{v:.035-.003*i,at:.03+i*.055})}; // 玻璃碎裂＋碎晶灑落
  }
  return sfx}

const LET5='RNOTE',SFXS={};
function curPack(){const t=S.th||'n';return LET5[(S.ser&&S.ser[t])||0]||'R'}
function playSfx(name,arg){if(!S.sfx)return;try{if(!actx())return;const id=curPack(),sx=SFXS[id]||(SFXS[id]=build(id)),f=sx[name];if(f)f(arg)}catch(e){}}
let lastKey=0;
document.addEventListener('keydown',e=>{
  if(!S.sfx)return;
  const t=e.target;
  if(!t||t.disabled||t.readOnly||!(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&/^(text|search)$/.test(t.type))))return;
  const k=e.key;
  if(k==='Shift'||k==='Control'||k==='Alt'||k==='Meta'||k==='CapsLock'||k==='AltGraph')return;
  const now=performance.now();if(now-lastKey<22)return;lastKey=now;
  if(k==='Backspace'||k==='Delete')playSfx('del');
  else if(k==='Enter')playSfx('enter');
  else if(k.startsWith('Arrow')||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown'||k==='Tab'||k==='Escape')playSfx('nav');
  else playSfx('key');

function pickRec(a){

  let c=a.filter(t=>!rc.includes(t));if(!c.length)c=a.filter(t=>t!==rc[rc.length-1]);if(!c.length)c=a;

}

    ex.add(t);const nn=Object.assign({},n,{id:'n'+now+'i'+i+Math.random().toString(36).slice(2,5),title:t,icon:'⚠️',order:base+i});if(nf)nn.folderId=nf;else delete nn.folderId;delete nn.ore;delete nn.coin;out.push(nn);add++;
  });
  return{notes:out,folders:fout,sort:S.sort,add,sk};
}
function commitImport(next){
  const snap={notes:JSON.parse(JSON.stringify(S.notes)),folders:JSON.parse(JSON.stringify(S.folders)),sort:Object.assign({},S.sort),sel:S.sel};
  const trial=Object.assign({},S,{notes:next.notes,folders:next.folders||S.folders,sort:next.sort||S.sort,sel:null,q:''});
  try{localStorage.setItem(KEY,JSON.stringify(trial))}catch(e){playSfx('err');say('空間不足，未匯入，原有資料沒有任何變動。',{lv:'warn'});return false}
  S.notes=trial.notes;S.folders=trial.folders;curF=null;eyeOpen=true;S.sort=trial.sort;S.sel=null;S.q='';$('sq').value='';ms.clear();
  let persisted=false;try{localStorage.setItem(PKEY,JSON.stringify(snap));persisted=true}catch(e){}
  pend={snap,persisted};
  if(!S.notes.length)seedNotes();else{const f=activeList()[0];S.sel=f?f.id:null}
  save();render();pendMsg();return true;
}
function pendMsg(){
  if(!pend)return;
  say('資料已匯入，請查看是否正確？'+(pend.persisted?'':'（重新整理後無法復原）'),{lv:'act',id:'imp',pin:true,actions:[{label:'確認無誤',fn:impOk},{label:'復原之前的資料',fn:impUndo}]});
}
function impOk(){
  if(!pend)return;pend=null;try{localStorage.removeItem(PKEY)}catch(e){}
  sayOff('imp');playSfx('pick');render();say('已確認，可以繼續編輯了。',{lv:'info',rx:'ok'});
}
function impUndo(){
  if(!pend)return;const sn=pend.snap,k=[S.notes,S.sort,S.sel,S.folders];
  S.notes=sn.notes;S.folders=sn.folders||[];curF=null;eyeOpen=true;S.sort=sn.sort||S.sort;S.sel=sn.sel;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){S.notes=k[0];S.sort=k[1];S.sel=k[2];S.folders=k[3];playSfx('err');say('復原失敗：儲存空間不足。',{lv:'warn'});return}
  pend=null;try{localStorage.removeItem(PKEY)}catch(e){}
  sayOff('imp');ms.clear();playSfx('restore');render();say('已復原到匯入前的資料。',{lv:'info'});
}

const README=`R note 使用說明
════════════════════════

【這是什麼】
R note 是一個簡單的網頁小工具，用來建立純文字資料，並分門別類地記錄與存放。
打開網址就能使用。內容只有純文字，沒有複雜的排版指令，就像排在書架上、可以隨手翻閱與書寫的各類筆記本。
工具裡還藏了一些小祕密：游標光暈、打字碎石、挖礦寶石、換取金額……讓你寫的每一篇文章都自帶「含金量」，打字也多一點樂趣。

適合用來記錄：
．工作待辦、臨時記事
．各種草稿與想法
．擬定 AI 對話文稿
．常查找的備忘資訊，例如公司分機、網址
．想買的東西、看過的電影
．敲鍵盤療癒自己（？）

使用環境
．以 Chrome 為研發基礎，主要提供桌面版瀏覽器（Chrome、Edge）使用。
．大量使用滑鼠拖曳、滑鼠停留提示與鍵盤快速鍵，不推薦在手機或平板上操作。
．Firefox、Safari 沒有經過完整測試。
．手機瀏覽器會自動進入簡易版：一張便條紙，打字也能挖礦；完整功能請使用電腦。


【先看這一段：你的資料存在哪裡】
你寫的每一個字，都只存在「你現在使用的這台電腦、這個瀏覽器」裡，不會上傳到網路，作者和其他人都看不到，也不會自動同步到別的裝置。

可以這樣想：
．它像一本放在書桌抽屜裡的日記本。換一台電腦、換一個瀏覽器（例如從 Chrome 換成 Edge），就像走進另一間房間，那裡的抽屜是空的。
．「清除瀏覽器資料」或「重灌電腦」，就像把整個抽屜清空，日記本一起不見，而且找不回來。
．用「無痕視窗」開啟，就像寫在便條紙上，關掉視窗就丟掉了。
．和別人共用同一台電腦、同一個瀏覽器帳號時，對方打開這個網址就看得到你的筆記，不建議在公用電腦使用。
．資料是以明文存放，不建議記錄密碼、帳號、身分證字號等敏感資料。

所以請養成備份的習慣，備份就像把日記影印一份，收到別的地方：
．每週匯出一次，或寫了重要內容就匯出。
．換電腦、重灌、清理瀏覽器之前，一定要先匯出。
．備份檔不要只放在同一台電腦裡，可以放進雲端硬碟，或寄給自己。
．右上角的匯出按鈕，超過 7 小時沒有備份、而且這段時間內容有變動，就會出現小紅點（浮現時會閃動幾下），提醒你該備份了；按一下匯出，紅點就會消失。

其他要知道的
．瀏覽器能存放的容量有上限（通常約 5MB），一般記事用不完；如果出現「儲存空間已滿」的提示，請先匯出備份，再刪除不需要的筆記。
．請不要同時開兩個分頁編輯這個網址，後存檔的分頁會把先存檔的內容蓋掉。
．圖示使用系統內建的表情符號，在不同電腦上的樣子會略有不同。


【備份與搬家】
匯出（備份）
．按右上角的匯出按鈕，會下載一個檔案，檔名像 R_note_backup_20261013_1711.json，通常在瀏覽器的「下載」資料夾裡。
．檔案裡有你所有的筆記（含封存區與暗格），內容是明文，請妥善保存。

匯入（還原、搬家）
．按右上角的匯入按鈕，選擇備份檔，會出現兩個選項：
　1. 取代現有筆記：目前所有內容會被備份檔取代，請小心操作。
　2. 追加為新筆記：把備份裡的筆記加進來，不動現有的。可能出現重複的標題或內容，追加的筆記會標上 ⚠，標題相同時會加上「_新匯入」，方便檢查整理。
．想把資料搬到另一台電腦：先在舊電腦匯出，把檔案帶過去，在新電腦打開同一個網址，再按匯入。
．匯入完成後，搜尋框上方會出現確認訊息：看過筆記沒問題就按「確認無誤」；發現不對勁，按「復原之前的資料」就會回到匯入前。確認之前，筆記暫時不能編輯，只能翻閱。
．以前如果是把網頁檔存在硬碟上使用，資料也不會自動出現在這個網址，同樣用「舊的那邊匯出、這邊匯入」搬過來。

更新
．這個工具放在網路上，每次打開同一個網址就是最新版，不用重新下載。更新後如果畫面沒有變，請按 Ctrl＋F5 重新整理；更新成功時，LOGO 右上角的版本號會改變。
．你的筆記不會因為更新而消失，但為免意外，請時常匯出備份。


【把它存成自己的單機版（離線使用）】
想在沒有網路的地方使用，或不想依賴網站，可以把這個網頁存成一個檔案，放在自己的電腦裡。

步驟（Chrome、Edge）
1. 先打開這個網址。
2. 在頁面空白處按右鍵，選「另存新檔」（或按 Ctrl＋S）。
3. 儲存類型選「網頁，僅 HTML」，不要選「網頁，完整」。
4. 存到你固定放資料的資料夾，例如「文件」，檔名可以自己取，例如 R_note.html。
5. 以後直接在這個檔案上按兩下，就會用瀏覽器打開，不需要網路。

注意事項
．單機版和網址版的資料是分開存放的，就像兩間房間，彼此看不到對方的筆記。要互通，請在一邊匯出、另一邊匯入。
．單機版不會自動更新。想升級時，回到網址重新存一次檔案；請先在舊版匯出備份，換成新檔案後再匯入，最保險。
．檔案請放在固定的位置，不要隨意搬動或換資料夾。搬動之後如果發現筆記像是不見了，用備份匯入就能找回來。
．如果存下來打開是一片空白或樣子不對，通常是存成了「網頁，完整」，請重新存一次「僅 HTML」。
．單機版開啟時，有些瀏覽器每次按「貼上並新增」都會詢問是否允許讀取剪貼簿，這是正常的。
．清除瀏覽器資料、換瀏覽器、換電腦，單機版的資料也不會跟著走，請照樣定期備份。


【基本操作】
．說明裡寫的「點」，都是按滑鼠左鍵；要按右鍵的地方會特別寫出來。
新增筆記
．在左側輸入框輸入標題，按 Enter 建立新筆記，新標題排在列表最上方。
．輸入框左邊的 + ，直接建立一則今天的日記；同一天重複建立，標題後面會自動加上編號。
．輸入框右邊的剪貼簿按鈕，把剪貼簿裡的文字貼成新筆記，標題取第一行有內容的文字；剪貼簿沒有文字時不會建立。第一次使用時，瀏覽器可能會詢問是否允許讀取剪貼簿，請選擇允許。

標題與圖示
．點一下標題，右邊顯示它的內容；點兩下標題，或選取後按 F2，可以改名（Enter 確認，Esc 取消）；選取後按 Enter，游標會進入右邊的內文區。
．標題不可重複，同名時自動加上 (2)、(3)……；標題前後的空白會刪除，中間的空白會變成底線。
．點標題前面的圖示，可以更換圖示；選單最下面可以貼上自己複製的單一 Emoji。每則筆記一定有圖示。
．滑鼠停在標題上，游標右下角會顯示標題、建立與修改時間，並跟著游標移動。

排序（左側四個按鈕）
．手形：手動排序，用滑鼠拖曳標題調整順序。
．時鐘：依修改時間排序。
．abc：依名稱排序。
．標籤：依圖示排序，順序就是圖示選單的排列。
．連點同一個按鈕可以切換正反順序，被選取的按鈕會顯示方向箭頭。

封存與刪除
．把標題拖曳到下方區域就是封存，拖回上方就是還原。
．封存區的垃圾桶可以永久刪除該筆記（會先確認）。
．上下兩區的分隔粗線、左右欄之間的拉條，都可以拖曳調整大小，點兩下會還原預設。

多選
．Ctrl＋點擊：加入或取消選取。Shift＋點擊：選取一整段。Ctrl＋A：選取整區。Esc：取消選取。
．選取後可以整批拖曳。按 Delete：在上方列表是移到封存區，在封存區是永久刪除（會先確認，並顯示數量）。

搜尋
．在搜尋框輸入關鍵字，按 Enter，列表只會留下標題或內容符合的筆記。

介面配色
．搜尋框最右邊的三顆按鈕，依序是「破曉」「逢魔」「月華」，一鍵切換整個介面的配色，會被記住。

資料夾
．列表右上角的「資料夾＋」可以新增資料夾：資料夾像檔案一樣直排在列表最上面，圖示旁邊寫著名字，沒有放進資料夾的筆記排在它們下面；新資料夾排最上面，並直接進入、可以馬上改名。
．最左邊的「檔案櫃」按鈕很寬，右邊會寫現在的狀態；進入資料夾後它會變成「回到檔案櫃」，點一下就回到外面。
．在檔案櫃裡，點一下資料夾是「選取」（右邊內文區會列出資料夾裡的筆記），再點一下已選取的資料夾（或快速點兩下）才「進入」：被打開的資料夾移到最上面，旁邊是它的名稱頁籤（點名稱改名、點色塊換顏色；名稱最多顯示約 6 個字，其餘用「…」，游標移上去看全名）。其他資料夾名字消失、變成小圖示，仍排在同一直排。頁籤下面是淡出的內頁，裡面只顯示這個資料夾的筆記。進入後「＋」變成紅色「－」，可以刪除資料夾（筆記不會消失，會回到檔案櫃；刪除後幾秒內可按「復原」）。
．把筆記拖到資料夾圖示上就能收進去；在資料夾裡拖曳筆記時，頁籤右邊會出現「移出資料夾」的虛線框，把筆記拖進去（或拖到「檔案櫃」按鈕上）就是移出。筆記標題上方的色塊和細線（只在眼睛關閉或搜尋時出現）是它所屬資料夾的顏色，色塊越靠右代表資料夾排得越後面。
．資料夾裡沒有筆記時，圖示上的色塊只畫線；有筆記才填色。游標移到檔案櫃裡的資料夾上，會顯示篇數與最近修改的幾篇名稱。散檔（沒有放進資料夾的筆記）的圖示，在資料夾圖示與名稱之間。
．單點資料夾時，右邊內文區會變成斜線（不能打字），直接接著資料夾名稱列出裡面的筆記名稱（順序跟著左邊的排序按鈕）；點一下檔名就會直接進入資料夾並開啟那篇筆記。選資料夾時，筆記的選取框會消失；點回筆記即解除。
．先在清單裡選好幾篇筆記，再按右上角的「＋」，會建立新資料夾並把這些筆記放進去（可按「復原」）。
．檔案櫃的資料夾圖示右上角會顯示裡面有幾篇筆記（0 篇不顯示，超過 99 顯示 99+）。
．在檔案櫃裡 Ctrl／Shift＋點可以多選資料夾。右上角有三顆固定的按鈕：眼睛、「＋」（新增資料夾；選了筆記再按，會把筆記放進新資料夾）、「－」（刪除所選的資料夾，沒有選取時是灰色）。你也可以把選中的資料夾拖到「－」上，或按 Del 刪除。筆記不會被刪除，會回到檔案櫃；刪除後 5 秒內可按「復原」，這段時間內如果又做了新的資料夾或封存操作，「復原」就會消失。按 Esc 或在左欄空白處點一下可取消選取；點筆記或開始搜尋也會取消；拉分隔線、切換排序、切換主題都不會取消。退回檔案櫃時，剛才那個資料夾會維持選取狀態。
．在筆記、資料夾、封存區或暗格的項目上按右鍵，會出現選單：筆記可以開啟、改名、設為唯讀、封存（或放入暗格）；資料夾可以進入、改名、換顏色、刪除；筆記還可以「建立副本」（只複製文字內容）；封存區和暗格裡的筆記可以取出（放回檔案櫃），封存區的還可以永久刪除；在檔案櫃的空白處按右鍵可以新增資料夾。多選時選單只提供適用於所有選取項目的動作。內文區和輸入框保留瀏覽器原本的右鍵選單（複製、貼上等）。
．資料夾最多 99 個，滿了就不能再新增；每個資料夾放幾篇筆記則沒有限制。
．游標不在內文區、也不在輸入框時，可以用鍵盤操作左欄：上下鍵在資料夾和筆記之間連續移動（停在資料夾上，右邊顯示它的檢視；停在筆記上，就是開啟那篇）；在資料夾上按 Enter 進入、F2 進入並改名；在筆記上按 Enter 進入內文、F2 改標題。進入資料夾後，上下鍵只在這個資料夾的筆記之間移動。
．搜尋是全域的：搜尋時資料夾列會暫時隱藏，結果是所有的筆記；清掉搜尋字就回到原本的位置。
．資料夾檢視裡可以把筆記從左邊拖進來，放進那個資料夾。
．資料夾不能封存，只能刪除；要收起筆記，請選筆記再封存或放入暗格。被封存或放進暗格的筆記不再屬於任何資料夾；取出時（暗格按「↑」、或拖回清單、拖到資料夾）會放在你放的地方，按「↑」則回到檔案櫃。
．資料夾順序只能手動拖曳調整（Ctrl／Shift＋點可多選），不受四個排序按鈕影響。
．眼睛按鈕：關閉後所有資料夾隱藏、筆記攤平顯示，排序按鈕照常使用（進入資料夾時不能關閉）。重新整理後一定是打開的。
．資料夾不能封存；筆記被封存後就離開資料夾，還原時回到檔案櫃。

鎖定打字範圍
．音效按鈕右邊的「兩枝鉛筆」按鈕：開啟後，內文區右側會出現上下兩支鉛筆，夾住中間約 6 行的範圍（淡淡的底色）。
．游標在範圍內時畫面不會動，回頭改錯字也不會跳；打字寫到範圍下緣，才會一行一行往上推，讓你一直在同一個高度打字。範圍以下的文字還在，隨時可以用滾輪往下看；文章開頭之前、結尾之後都是斜線的「紙的盡頭」。在範圍上緣以上打字、或用鍵盤把游標往上移出範圍，畫面會自動把游標那一行放回範圍第一行（滑鼠點擊不會）。
．用游標拖曳上下兩支鉛筆可以調整範圍；游標碰到鉛筆，或拖動時，會出現整條虛線輔助對齊。設定會被記住，手機直式不顯示。內文不能輸入時（沒選筆記、唯讀、匯入確認中），鉛筆會暫時消失。

內文與右上角按鈕
．內文是純文字，可用 Ctrl＋Z 復原（切換到別則筆記後，上一則的復原紀錄會消失）。
．內文上方靠右顯示這則筆記的「總字數」，空白與換行不計；每達到整百字會有一點小特效。
．唯讀：按內文上方、「總字數」旁邊的鉛筆斜線按鈕，這則筆記就不能輸入（仍可選取、複製），標題旁會出現小圖示，內文底下會有淡淡的斜線。在內文點兩下就能解除。說明筆記預設是唯讀。
．音效由瀏覽器即時合成，不需要下載聲音檔；打字、按鈕、LOGO 字母、挖礦等都有對應的聲音，預設是無聲。
．筆記裡的網址（http:// 或 https:// 開頭），按住 Ctrl，網址會亮起來並出現手指游標，點一下就會在新分頁開啟。唯讀的筆記裡，網址會一直畫上底線，直接點就能開。「像素刻工館」這幾個字在任何筆記裡都會畫上底線，按住 Ctrl 點一下（唯讀筆記直接點）就會開啟作者的 LINE 貼圖頁。
．搜尋框上方的文字是系統訊息：偶爾會有問候、整點報時和功能提示；紅色的是警告，點一下可以關掉。
．不想看到日常的問候語，可以按「複製內文」右邊的機器人頭按鈕讓小機器人打盹（再按一次叫醒它）。打盹時它還站在原位、偶爾抬頭看看，不會再有問候、閒聊和整點報時，只剩下很久才出現一次的功能提示，以及你操作後的必要提示。
．左邊「貼上並新增」上方的小機器人會陪著你：訊息出現時，頭上的天線燈會換顏色、牠也會做出對應的動作；挖礦（e 開啟時）有收穫牠也會反應。放著不理它兩分鐘會開始生鏽，十分鐘後鏽到底，每打一個字就恢復一點點（打盹時也一樣，只是不會再生鏽）。手機直式不顯示。
．右上角按鈕依序是：音效（點一下依序切換：無聲、大聲、小聲，預設無聲）、鎖定打字範圍（兩枝鉛筆）、插入日期時間（插在游標處）、複製內文（不含標題）、機器人頭（讓小機器人休息／叫醒，開關日常問候語）、匯出備份、匯入備份、使用說明（問號）。
．按「使用說明」，會打開最新版的說明筆記「_讀我」；你編輯過的舊說明不會被覆蓋，只會另外新增一篇。


隱藏在 LOGO 裡的祕密功能
════════════════════════
點擊左上角 R note LOGO 裡的字母，可以開關各種隱藏功能，沒有任何提示文字。

R：防窺模式
．開啟後內文變成較淡的灰色，左側列表的標題與圖示也會慢慢變模糊，讓遠處的人不容易看清內容。
．這個狀態下一段時間沒有敲鍵盤，除了 LOGO 以外的畫面全部模糊，並且暫時不能用滑鼠操作；按任意鍵即可恢復。
．再點一次 R 關閉。

o：光暈
．開啟後，文字游標周圍有一圈淡淡的光，滑鼠在內文區也會帶著一圈光暈。o 裡面出現圓點代表開啟。

t：打字碎石
．開啟後，打字會噴出小碎石並依重力掉落，一次大量貼上會有落石效果。t 的左半橫槓掉落代表開啟。

e：礦石展示櫃
．不論 e、t 有沒有開，打字時都有機率挖到礦石，各則筆記分別收藏。
．e 躺下代表把展示櫃與錢袋顯示在內文上方，礦石只用形狀與顏色區分；e 立起來時礦石仍會默默累積，只是看不到。
．點一下礦石會把該種全部賣出，換成錢包裡的金額；賣出後數量歸零，圖示保留。
．礦石與錢包跟著該則筆記一起存檔與備份。

n：暗格
．n 變成 N 時，下方的封存區會翻轉成暗格，底色變成最深的黑色；可以把筆記拖進去，鎖頭圖示會把筆記放回上方列表。
．此時封存區的筆記只是暫時看不到，並沒有消失；再點一次切回 n，封存區就回來了，暗格則收起。
．搜尋只會找得到目前看得見的區域。
．重新開啟檔案時一定是 n 的狀態。暗格只是藏起來，並不是加密，備份檔裡仍然看得到內容。


【小提醒】
．o、t、e 的開關狀態會被記住；R 與 n 每次開啟都是關閉。
．如果所有筆記都被刪光，會自動重新產生這份說明和一篇今天的日記；也可以隨時按右上角的問號取得說明。
