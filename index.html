function alMd(r){return r.md===0||r.md===1||r.md===2?r.md:(r.once?0:1)}
function alRows(){if(!Array.isArray(S.al)||S.al.length!==2)S.al=[0,1].map(i=>({on:0,t:i?'23:00':'07:00',m:'',md:1}));S.al.forEach(r=>{r.md=alMd(r);delete r.once});if(!S.alv){S.alv=1;S.al.forEach((r,i)=>{if(!r.on&&!r.m&&r.t==='22:00')r.t=i?'23:00':'07:00'})}return S.al}
let alDirty=0;
function alNext(t,from,md){const m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(t||'');if(!m)return 0;const d=new Date(from);d.setHours(+m[1],+m[2],0,0);if(d.getTime()<=from)d.setDate(d.getDate()+1);if(md===2)while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d.getTime()}
const alSnd={},ALATE=30*6e4;let alBoot=0;
function alTick(){if(PH||!Array.isArray(S.al))return;const now=Date.now();
  if(!alBoot){alBoot=1;let ch=0;S.al.forEach(r=>{if(r.pend&&now-(r.du||0)>ALATE){r.pend=0;r.su=0;r.tries=0;ch=1}});if(ch)save()}
  S.al.forEach((r,i)=>{
    if(r.pend)return;
    if(r.sn&&now>=r.sn){if(now-r.sn>ALATE){r.sn=0;r.su=0;save();return}const c=alClaim(i,r.sn);r.sn=0;if(!c){save();return}r.pend=1;r.late=0;r.du=now;r.tries=0;save();return}
    if(!r.on||!r.nx||now<r.nx||r.sn)return;
    const late=now-r.nx,mine=alClaim(i,r.nx);
    if(alMd(r)===0){r.on=0;r.nx=0}else r.nx=alNext(r.t,now,alMd(r));
    if(late>ALATE){save();alPaint();return}
    if(!mine){save();alPaint();return}
    r.su=0;r.pend=1;r.late=late;r.du=now-late;r.tries=0;save();alPaint()});
  alShow()}

function alClaim(i,t){const k='R_note_alc'+i;try{if(localStorage.getItem(k)===String(t))return false;localStorage.setItem(k,String(t))}catch(e){}return true}

const alIsMsg=m=>m.id&&/^al\d+$/.test(m.id)&&!m.leaving;
function alShow(){
  const up=()=>{alOpen=S.al.filter(x=>x.pend).length;alTitle()};
  let P=S.al.map((r,i)=>r.pend?i:-1).filter(i=>i>=0);
  const id='al'+P.join('');
  SM.list.filter(m=>alIsMsg(m)&&m.id!==id).forEach(m=>retire(m,true));
  if(!P.length){up();return}
  if(SM.list.some(m=>m.id===id&&!m.leaving)){up();if(P.some(i=>!alSnd[i])){P.forEach(i=>alSnd[i]=1);alSound()}return}
  if(smHas(id)){up();return}
  P.forEach(i=>{const r=S.al[i];if((r.tries=(r.tries||0)+1)>30){r.pend=0;save()}});
  P=P.filter(i=>S.al[i].pend);if(!P.length){up();return}
  const tx=r=>{const mn=Math.floor((r.late||0)/6e4),lt=mn>=60?Math.floor(mn/60)+' 小時'+(mn%60?' '+mn%60+' 分鐘':''):mn+' 分鐘';return (r.m||'時間到了')+(mn>=2?'（錯過了 '+lt+'，剛剛我叫不到你）':'')};
  const acts=[{label:'知道了',fn:alAck}];if(P.every(i=>(S.al[i].su||0)<2))acts.push({label:'5 分鐘後再提醒',fn:alSnooze});
  const blk=!!(navigator.userActivation&&!navigator.userActivation.hasBeenActive)&&(S.sfx||S.alf);
  say('⏰ '+P.map(i=>tx(S.al[i])).join('／')+(blk?'（點一下畫面就會響）':''),{lv:'act',id:'al'+P.join(''),pin:true,actions:acts,rx:'act'});
  if(SM.list.some(m=>m.id==='al'+P.join('')&&!m.leaving)){up();if(P.some(i=>!alSnd[i])){P.forEach(i=>alSnd[i]=1);alSound()}}}
function alSound(){if(navigator.userActivation&&!navigator.userActivation.hasBeenActive){if(!alSound.w){alSound.w=1;const f=()=>{removeEventListener('pointerdown',f,true);removeEventListener('keydown',f,true);alSound.w=0;if(S.al&&S.al.some(r=>r.pend))alSound()};addEventListener('pointerdown',f,true);addEventListener('keydown',f,true)}return}
  if(S.sfx){playSfx('alarm');return}if(S.alf){S.sfx=1;try{playSfx('alarm')}finally{S.sfx=0}}}
function alAck(){S.al.forEach((r,i)=>{if(!r.pend)return;r.pend=0;r.su=0;r.sn=0;r.tries=0;alSnd[i]=0});SM.list.filter(alIsMsg).forEach(m=>retire(m,false));save();alOpen=0;alTitle()}
function alSnooze(){const t=Date.now()+5*60000;S.al.forEach((r,i)=>{if(!r.pend)return;r.pend=0;r.su=(r.su||0)+1;r.sn=t;r.tries=0;alSnd[i]=0});SM.list.filter(alIsMsg).forEach(m=>retire(m,false));save();alOpen=0;alTitle();say('好，5 分鐘後再提醒你。',{lv:'info',rx:'ok'})}
function alFmt(h,m){return (h<12?'上午 ':'下午 ')+(h%12||12)+':'+p2(m)}
function alWhen(ts){const d=new Date(ts),n=new Date(),dk=x=>x.getFullYear()*400+x.getMonth()*32+x.getDate(),t=new Date(n.getTime()+864e5),hm=alFmt(d.getHours(),d.getMinutes());
  return (dk(d)===dk(n)?'今天':dk(d)===dk(t)?'明天':'週'+'日一二三四五六'[d.getDay()])+' '+hm}
function alConfirm(){if(!alDirty)return;alDirty=0;const l=alRows().filter(r=>r.on).map(r=>alFmt(+r.t.slice(0,2),+r.t.slice(3))+' 「'+(r.m||'時間到了')+'」（'+['只提醒一次','每天','工作天'][alMd(r)]+'）');
  say(l.length?'我知道了，'+l.join('；')+'，我會提醒你。'+(MS.alw?'':(MS.alw=1,msSave(),'記得別關掉網頁，不然我喊破喉嚨你也聽不到。'))+(l.length===2&&alRows()[0].t===alRows()[1].t?'兩個提醒同時間，我會一起說。':'')+(S.mute?'（我休息中，但鬧鐘照響）':''):'好，提醒都關掉了。',{lv:'info',rx:'ok',id:'alset'})}
function alPaint(){const p=$('spal');if(!p||!Array.isArray(S.al))return;
  p.querySelectorAll('.alr').forEach(el=>{const r=S.al[+el.dataset.i];if(!r)return;el.querySelector('.alo').checked=!!r.on;el.querySelector('.alc').value=String(alMd(r));el.querySelector('.aln').textContent=r.on&&r.nx?'下次　'+alWhen(r.nx):'';
    const hh=+(r.t||'22:00').slice(0,2),mm=+(r.t||'22:00').slice(3),m=el.querySelector('.alm');el.querySelector('.alap').value=hh>=12?'1':'0';el.querySelector('.alh').value=String(hh%12||12);el.querySelector('.alm2').value=String(mm);if(document.activeElement!==m)m.value=r.m||''});
  $('spalf').checked=!!S.alf}
function alRead(el){const r=alRows()[+el.dataset.i];
  r.on=el.querySelector('.alo').checked?1:0;r.t=p2((+el.querySelector('.alh').value%12)+12*(+el.querySelector('.alap').value))+':'+p2(+el.querySelector('.alm2').value);r.m=el.querySelector('.alm').value.slice(0,30);r.md=+el.querySelector('.alc').value;
  if(r.on){r.nx=alNext(r.t,Date.now(),r.md);r.su=0;r.sn=0}else{r.nx=0;r.sn=0}
  alDirty=1;alPaint();save()}

function tick(){const d=new Date();chime(d);try{alTick()}catch(e){}$('cd').textContent=`${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())} 週${'日一二三四五六'[d.getDay()]}`;$('ct').textContent=clkText(d)}
tick();setInterval(tick,5000);$('ct').parentNode.style.userSelect='none';chk();setInterval(chk,60000);
const README=`R note 使用說明
════════════════════════
存在你自己瀏覽器裡的純文字筆記，打開網址就能寫，不用註冊、登入，即寫即存。

【你的筆記很安全】
．你寫的字只存在自己的瀏覽器裡，不經過任何伺服器、不記在雲端，只有你看得到。
．會在設定的時間提醒備份資料；有備份檔，就算瀏覽器資料被清除，也能匯入還原。
．支援「自動備份」（電腦版 Chrome／Edge）：有變動就自動存進你指定的檔案。
．本機端保留 7 天歷史紀錄，每篇筆記保留 10 個版本，誤刪、改壞多半都能找回。
　——詳情見後方【基本操作】與【備份與搬家】。

【快速上手】
．在左上角輸入標題、按 Enter 新增筆記；欄位左方的「＋」可以快速新增日記標題的筆記。
．小機器人站的按鈕，可以把你剪貼簿（Ctrl＋C）的文字內容一鍵貼成新筆記，收集資料超方便。
．直接把文件檔案（.txt/.md……等）拉進來，快速匯入新筆記繼續編輯！（支援多文件匯入）

想讓打字增添一點樂趣？
．打開神秘的開關（？），打字不只會挖到寶石（？），還能換算筆記的含金量（？）
．左上角的標題 R note，每個字母都可以點擊（難道就是神秘開關？文末有詳細介紹）。
．聽說裡面還埋藏著讓你專注打字的小遊戲？（謎）

【工具介紹】
R note 是架構在瀏覽器裡的純文字筆記工具……
．它像一本放在書桌抽屜裡的筆記本。換一台電腦（瀏覽器），就像換了另一間房間，那裡的抽屜是空的。
．「清除瀏覽器資料」或「重灌電腦」，就像整個抽屜清空、筆記本也不見；但有先備份就不怕！
．用「無痕視窗」開啟，就像寫在便條紙上，關掉視窗就丟掉了。
．和別人共用電腦、同一個瀏覽器（同一個使用者設定檔）時，對方打開這個網址就看得到你的筆記，不建議用於公用電腦。
．資料是以明文存放，不建議記錄密碼、帳號、身分證字號等敏感資料。
．筆記內的網址，按住 Ctrl 會顯示成超連結，再點一下就在新分頁開啟。
．把備份檔放進雲端硬碟或寄給自己，作為異地保管，多一份保障。
．此網頁可另存為單機版，離線狀態也能用。

【基本操作】
新增與整理
．把文字文件拖進網頁，就會建立成筆記（檔名是標題），可以一次拖多個檔案。
．點一下標題看內容，點兩下（或按 F2）改名；點標題前面的圖示可以換圖示。
．標題輸入框下面的四個按鈕：手動排序（拖曳調整）、修改時間、名稱、圖示；再點一次切換正反序。
．把標題拖到下方區域是封存，拖回上方就還原；封存區的垃圾桶可以永久刪除。
．Ctrl＋點是加選，Shift＋點是選一整段，Ctrl＋A 全選，選好後可以整批拖曳或按 Delete。
．在筆記上按右鍵可以置頂，讓常用筆記留在最上方。
．在內文按 Tab 可以讓這一行往內縮，Shift＋Tab 縮回；選取多行可以一起調整。

搜尋與網址
．搜尋框輸入關鍵字，按 Enter，只留下符合的筆記（封存區也搜得到）。
．筆記裡的網址，按住 Ctrl 點一下，就在新分頁開啟；唯讀筆記直接點就能開。

外觀與聲音
．搜尋框右邊，從左到右是：音效開關、音色、亮色系／灰色系／暗色系三顆主題按鈕。同一顆主題按鈕連續點，會換成同色系的下一組。
．機器人設定裡有「定時提醒」：填好時間和一句話（可選一次、每天、工作天），時間到了機器人會把那句話固定在畫面上，可以按「知道了」或「5 分鐘後再提醒」（最多延 2 次）。機器人只住在這個網頁裡：關掉分頁或瀏覽器，它就喊不到你了（之後打開會補提醒）；分頁放在背景時，可能會晚一點點才響。可勾「強制出聲」。
．個人檔案分成「名號、採礦、調性、紀錄」四頁：名號可以寫筆名（暱稱/ID）；調性可以微調整體的感覺與邊角；紀錄可以把 Writer's Card 拓印成圖片；備份檔會帶著紀錄，匯入時驗證碼對不上會標「未驗證」。
．十字鎬升級會解鎖新的採礦效果，在個人檔案的「採礦」分頁切換。
．機器人左邊的齒輪是「設定」：字級、時鐘與日期時間樣式、備份提醒與自動備份、清除資料等都在這裡；「機器人」分頁可以調整報時，以及機器人說話和活動的頻率。
．設定打開時，設定左緣下方有一個「Profile」標籤，拉出來就是「個人檔案」（檔案櫃右邊那一張）；再按一次標籤就收回。

唯讀與 Markdown 預覽
．內文上方「總字數」旁邊的鉛筆按鈕，把筆記鎖成唯讀；在內文點兩下可解鎖。
．鉛筆左邊的「M↓」按鈕，把筆記排成 Markdown 預覽（標題、清單、表格、程式碼等），只能看不能改，待辦的勾選可以直接點；再按一次回到文字。

分割對照與鎖定打字範圍
．內文上方最左邊的「分割對照」按鈕把內文切成兩半：一邊是可以編輯的筆記，另一邊是唯讀的對照筆記（有斜線）。
．分割中點左欄的筆記會放到對照區；要換編輯的筆記，在筆記上按右鍵選「在編輯區開啟」。中線可以拖曳，點兩下回到各半；滑到中線上方有左右對調的按鈕。
．「分割對照」右邊是「鎖定打字範圍」：打字的那一行會固定在兩支鉛筆之間；拖鉛筆調整範圍，摸到鉛筆會顯示是第幾行。
．最後打字的那篇筆記，左欄標題前會有一支小鉛筆；離開它太久，機器人會問你要不要回去。

歷史紀錄與右鍵選單
．在筆記上按右鍵選「歷史紀錄」（或在檔案櫃按「全筆記歷史紀錄」），可以看到舊版本與刪掉的筆記，並救回來。
．在筆記或資料夾上按右鍵，還有更多功能；筆記與資料夾都能另存為文字檔（.txt 或 .md）。光色按鈕和音色按鈕上按右鍵，可以直接選想要的那一個。

【資料夾】
．資料夾列右邊的「＋」新增資料夾，「－」刪除所選的資料夾（裡面的筆記不會消失），刪除後幾秒內可以按「復原」。
．最左邊的「檔案櫃」按鈕：點一下打開總覽，列出所有資料夾和筆記，點任何一篇都能直接開啟；再點一下（或按 Esc）回到筆記。
．點一下資料夾是選取，右邊會列出裡面的筆記；再點一下才進入資料夾。
．選取或進入資料夾後新增的筆記，會放進該資料夾。
．把筆記拖到資料夾圖示上就能收進去；拖到「檔案櫃」按鈕或「移出資料夾」的虛線框，就能移出。
．眼睛按鈕：隱藏所有資料夾，筆記全部攤平顯示。
．收納按鈕（眼睛左邊那顆）：資料夾縮成左邊一排小標籤，再按一次展開。

【鎖定打字範圍】
右上角最左邊的「兩支鉛筆」按鈕，會在內文區右側出現上下兩支鉛筆，夾出一個範圍，可以用滑鼠拖曳調整。
打字超過這個範圍時，畫面會自動捲動，讓你一直維持在舒服的視線高度，不用再自己捲動頁面。用方向鍵閱讀文章時，畫面也會穩穩地跟著走，很有打字機的手感。

【右上角的按鈕】
由左到右：機器人（關閉後僅提示系統必要訊息；滑過去可以看說話和活動的電量，按右鍵可以調整）、匯出備份、匯入備份、自動備份（白紙加 A，僅電腦版 Chrome／Edge）、使用說明（？）。

【內文上方的按鈕】
由左到右：鎖定打字範圍、插入日期時間、複製、Markdown 預覽、唯讀。複製平常是複製整篇；框選文字後圖示會變成虛線框，只複製框選的部分。

【備份與搬家】
．匯出：下載一個備份檔（.json），建議定期匯出，重要內容寫完就匯出。
．匯入：選備份檔，可以「取代現有筆記」或「追加為新筆記」；匯入後先瀏覽，沒問題按「確認無誤」，不對勁就按「復原之前的資料」。「取代」連光色、音色、字級等設定也一起還原，「追加」不動設定。
．自動備份：按右上角的「自動備份」按鈕指定一個檔案，之後有變動就自動存進去；再點按鈕可以看狀態或停止。它是把整份筆記存成最新一份備份檔，不是兩台電腦的即時同步；兩台電腦請各自用自己的備份檔，不要共用同一個。仍建議偶爾手動匯出。
．想知道備份檔放在哪裡、或想換個位置：到「設定」→「資料與備份」按「重新指定位置」，選擇視窗會直接開在目前備份檔的資料夾（按取消就維持原樣）。
．換電腦，或在家裡和公司接著寫：這邊匯出，那邊匯入（備份檔放進雲端硬碟就能在兩邊取用）。到新電腦請先匯入，再設定自動備份。

【小提醒】
．清除瀏覽器資料、重灌電腦之前，先確認備份檔是新的。
．無痕視窗關掉就沒了，公用電腦也不建議使用。
．內容是明文存放，不建議記密碼或祕密內容。（暗格只是把筆記藏起來，不是加密）
．建議只開一個分頁編輯；同時開兩個時，一邊會先暫停，按「重新載入」就能看到最新內容。

【更新與單機版】
．這個工具放在網路上，每次打開網址就是最新版；想確認請按 Ctrl＋F5，更新不會讓筆記消失。
．單機版：在網頁空白處按右鍵「另存新檔」，格式選「網頁，僅 HTML」，存起來按兩下就能開，離線也能用。單機版的資料和網址版是分開的，要互通請匯出再匯入。

【LOGO 裡的小機關】
點擊左上角 R note 的字母，可以開關各種小機關：
．R：防窺模式，內文變淡、一段時間不打字會整個畫面模糊。
．o：開啟游標周圍的光暈。
．t：內文打字的小碎石效果。
．e：顯示礦石展示櫃和錢袋（沒顯示時仍會默默累積）。
．n：把下方的封存區翻成「暗格」，一個藏筆記的地方（不是加密）。翻開時，選取筆記按 Insert 就能放進去。
o、t、e 的開關會被記住；R 和 n 每次重新開啟都是關閉。

  q('#clcf').oninput=clChk;
  const H=q('#hold');let t0=0,raf=0,done=false;
  function st(){if(!H.classList.contains('rdy')||done)return;t0=performance.now();H.classList.add('hd');const rm=RM();
    const step=()=>{const p=Math.min(1,(performance.now()-t0)/2000);H.style.setProperty('--p',p*360+'deg');if(rm)q('#holdt').textContent='按住中……';
      if(p>=1){done=true;H.classList.remove('hd');q('#holdt').textContent='清除中…';clRun(clSc);return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
  function sp(){cancelAnimationFrame(raf);H.classList.remove('hd');if(!done){H.style.setProperty('--p','0deg');q('#holdt').textContent='按住 2 秒'}}
  H.onpointerdown=st;['pointerup','pointerleave','pointercancel'].forEach(e=>H.addEventListener(e,sp));
  H.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();st()}};H.onkeyup=e=>{if(e.key===' '||e.key==='Enter')sp()};
  $('clw').classList.add('on');
}
function clChk(){const H=$('clw').querySelector('#hold'),ok=PH||$('clw').querySelector('#clcf').value.trim().toLowerCase()==='delete';H.classList.toggle('rdy',ok);$('clw').querySelector('#holdt').textContent=ok?'按住 2 秒':'🔒';H.style.setProperty('--p','0deg')}
function clClose(){$('clw').classList.remove('on');$('clw').innerHTML=''}
async function clBackup(){
  const d=new Date(),txt=JSON.stringify(buildExport(d),null,2);let name=`R_note_備份_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.json`;
  try{
    if(typeof window.showSaveFilePicker==='function'){const h=await showSaveFilePicker({suggestedName:name,types:[{description:'R note 備份',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(txt);await w.close();name=h.name||name}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  }catch(e){if(e&&e.name==='AbortError')return;playSfx('err');const t=$('clw').querySelector('#bks');if(t)t.textContent='沒能存成功，請再試一次。';return}
  clBk=true;S.lastExport=Date.now();S.bkN=S.notes.length;S.bkF=S.folders.length;save();chk();
  const q=i=>$('clw').querySelector(i);q('#clbk').classList.add('done');q('#bkt').textContent='✓ 已備份';q('#bkh').textContent=name;q('#bks').textContent='可以繼續了。這個檔案請自己保管（或在清乾淨之後刪掉）。'}
const delDb=n=>new Promise(r=>{try{const q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=()=>r()}catch(e){r()}setTimeout(r,1200)});
async function clRun(sc){
  stale=true;clearTimeout(st);
  try{clearTimeout(AB.t);AB.h=null;ABM.on=0;abMetaSave();await ABS.clear()}catch(e){}
  try{if(HS.db){HS.db.close();HS.db=null}}catch(e){}
  const wr=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
  try{
    if(sc==='all'){
      const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(R_note|plain-notes)/.test(k))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k));
      await Promise.all([delDb('R_note_hist'),delDb('R_note_fs')]);
    }else if(sc==='notes'){
      S.notes=[];S.folders=[];S.sel=null;S.lastExport=0;delete S.bkN;delete S.bkF;try{localStorage.removeItem(PKEY)}catch(e){}wr();await delDb('R_note_hist');
    }else{
      S.notes.forEach(n=>{delete n.ore;delete n.coin;delete n.tk});
      S.xp=0;S.pick=0;S.tom=0;delete S.tmd;delete S.tz;delete S.hst;
      S.tt={p:[0,1,2],n:[0,1],nw:[],sp:0,sn:0,up:0,show:S.tt&&S.tt.show===0?0:1,auto:S.tt&&S.tt.auto===0?0:1};S.ts=undefined;S.rc=undefined;delete S.rcu;wr();
    }
  }catch(e){}
  const w=$('clw').querySelector('.wc');if(w)w.innerHTML='<h2>已清除</h2><p class="sub">正在重新載入……</p>';
  setTimeout(()=>location.reload(),500);
}
setp.querySelector('#spdz').onclick=clOpen;
sqa('#spal .alr').forEach(el=>el.querySelectorAll('input,select').forEach(i=>i.addEventListener('change',()=>alRead(el))));
sq('#spalf').onchange=e=>{S.alf=e.target.checked?1:0;save();playSfx('tick')};
</script>
