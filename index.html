const README=`R note 使用說明
════════════════════════

【一分鐘看懂】
R note 是放在瀏覽器裡的純文字筆記本：打開網址就能寫，不用註冊、不用安裝、不用按存檔。
你寫的字只存在這台電腦的這個瀏覽器裡，不會上傳，也不能自動同步到別的裝置，但所有筆記資料可以匯出/匯入備份。

想讓打字多一點樂趣嗎？
．打開神秘的開關（？），打字時會挖到寶石（？），每篇筆記可以計算出自己的「含金量」？
．檔案櫃裡好像還藏著什麼？（謎）
．左上角 R note 的每個字母都可以點點看（難道就是神秘開關？）。
．好用的「鎖定打字範圍」功能，動不動就寫出長篇大論的人一定要試試看。
．聽說後面還埋藏著讓你專注打字的小遊戲？（謎）

適合用途：臨時記事、工作待辦、進度日誌、各種草稿精修、擬定 AI 對話、常用備忘（分機、地址），或是敲鍵盤療癒自己（？）。

最佳使用環境：電腦版 Chrome 或 Edge。手機瀏覽會自動進入簡易版，只有一張便條紙，完整功能請用電腦。


【請定期備份】
筆記只存在你現在用的這台電腦、這個瀏覽器裡，就像放在抽屜裡的記事本：
．換電腦、換瀏覽器，那邊的抽屜是空的。
．清除瀏覽器資料、重灌電腦，筆記會一起消失，找不回來。
．無痕視窗關掉就沒了；公用電腦別用。
．內容是明文存放，不要記密碼或祕密內容。（暗格只是把筆記藏起來，不是加密）
．建議只開一個分頁編輯。同時開兩個分頁時，一邊寫了字，另一邊會先暫停，按「重新載入」就能看到最新內容，不會互相覆蓋。

右上角的「匯出」按鈕會下載一個備份檔（.json）。建議每週至少匯出備份一次，重要內容寫完就匯出。超過 7 小時沒備份、而且這段時間內容有變動，匯出按鈕會出現小紅點提醒你。備份檔可放進雲端硬碟，或寄給自己。

在電腦版 Chrome 或 Edge，還能用「自動備份」：匯入按鈕右邊的「自動備份」按鈕（圖示是白紙加一個 A）。先指定一個檔案，之後有變動，就會自動把整份資料存進那個檔案。
．按鈕右上角的小點是狀態：灰＝未啟用、綠＝運作中、黃色閃爍＝暫停了（點一下，選「繼續」）、紅色閃爍＝失敗或需要處理（點一下看原因）。
．預設每 5 分鐘最多備份一次，可以在檔案櫃右邊的資訊板改成即時、15 分鐘或 1 小時。備份檔會比你手上的資料慢一點，所以手滑亂刪的話，備份檔裡還是舊的樣子，可以用「匯入」救回來。
．指定檔案時，如果裡面已經有別的資料，會先問你要不要先匯入；筆記突然變很少時，會先暫停，問你要不要照樣備份。
．想放棄就點按鈕選「停止自動備份」，已存好的備份檔不會被刪除。
．自動備份只有一份最新的、不會保留舊版本，所以仍建議偶爾手動匯出。


【基本操作】
新增筆記
．左上角輸入框打標題，按 Enter 就建立；輸入框左邊的 + 是新增今天的日記。
．輸入框右邊（小機器人站的位置）是剪貼簿按鈕，一鍵把剪貼簿的文字貼成新筆記。
．把文字文件直接拖進網頁，放開滑鼠就會建立筆記：檔名是標題，內容是內文，可選多個檔案匯入。建立後會直接打開（一次拖多個檔案，就打開第一份）。
．在資料夾裡拖入檔案，新筆記會放進這個資料夾。

標題
．點一下標題看內容；點兩下（或按 F2）改名。
．點標題前面的圖示，可以換圖示，也能自訂 Emoji。

排序
．標題輸入框下面的四個按鈕：手動排序（拖曳標題調整）、修改時間、名稱、圖示。再點一次切換正反序。

封存與刪除
．把標題拖到下方區域就是封存，拖回上方就還原。封存區的垃圾桶可以永久刪除（會先確認）。
．Ctrl＋點是加選，Shift＋點是選一整段，Ctrl＋A 全選；選好後可以整批拖曳，或按 Delete。

搜尋
．搜尋框輸入關鍵字，按 Enter，只留下符合的筆記（封存區也搜得到）。

主題配色
．搜尋框右邊的三顆按鈕（亮色系、灰色系、暗色系），可依個人喜好切換適合的色調。
．同一顆按鈕連續點，會換成同色系的下一組（每個色系有 6 組），按鈕右上角會閃一下目前是第幾組。

唯讀
．內文上方、「總字數」旁邊的鉛筆按鈕，可以把這則筆記鎖成唯讀；在內文點兩下可解鎖唯讀狀態。
．鉛筆左邊的「M↓」按鈕：把這則筆記排成 Markdown 預覽（標題、清單、表格、程式碼等），只能看不能改，只有待辦的勾選可以直接點；再按一次回到文字。搜尋時不會顯示預覽。

網址
．筆記裡的網址，按住 Ctrl 會亮起來，點一下就在新分頁開啟。

右鍵選單
．在筆記或資料夾上按右鍵，查看更多可執行的功能。
．資料夾右鍵選單，可將該資料夾所有筆記合併匯出為一個文字檔（.txt），依照當下排序方式合併。


【資料夾】
．右上角的「＋」新增資料夾，「－」刪除所選的資料夾（裡面的筆記不會消失），刪除行為在幾秒內可搶救復原。
．最左邊的「檔案櫃」按鈕：點一下打開檔案櫃總覽，列出所有資料夾和筆記，點任何一篇都能直接開啟；再點一下（或按 Esc）回到筆記。進入資料夾後，點它就回到外面。
．點一下資料夾是選取，右邊會列出裡面的筆記，可以直接點開；再點一下才進入資料夾。
．把筆記拖到資料夾圖示上就能收進去；在資料夾裡，把筆記拖到「移出資料夾」的虛線框，或拖到「檔案櫃」按鈕，就能移出。
．資料夾的順序只能手動拖曳，不受四個排序按鈕影響。
．眼睛按鈕：關閉後，所有資料夾隱藏，筆記全部攤平顯示。
．點一下資料夾後，右邊列出的筆記可以直接拖：拖到「檔案櫃」按鈕或左邊的筆記區就移出資料夾，拖到另一個資料夾就換過去。
．收納按鈕（眼睛左邊那顆資料夾加箭頭）：資料夾縮成左邊一排小標籤，筆記往上排；再按一次展開。
．收納時，滑鼠碰到標籤會抽出來；點一下選取並轉正，再點進入；把筆記拖到標籤上就能收進去。要調整資料夾順序，請先展開。


【鎖定打字範圍】
音效按鈕右邊的「兩支鉛筆」按鈕，會在內文區右側出現上下兩支鉛筆，並畫出兩條線，夾出一個範圍。兩支鉛筆可以用滑鼠拖曳，調整範圍的大小。
超過這個範圍打字，會自動捲動到這個區域中，讓打字者維持在一個舒服的視線高度上，不用再操作頁面捲動。
因為文字游標一直被帶在這個範圍中，用上下方向鍵閱讀文章時，畫面也會穩穩地跟著走。
從文章任何一處開始打字，游標都會被帶回這個區域，很有打字機的手感與樂趣。


【右上角的按鈕】
由左到右：音效（無聲／大聲／小聲）、鎖定打字範圍、插入日期時間、複製內文、機器人（關閉後僅提示系統必要訊息）、匯出備份、匯入備份、自動備份（A，僅 Chrome／Edge 電腦版）、使用說明（？）。


【匯入與搬家】
．按匯入，選備份檔，有兩個選項：「取代現有筆記」或「追加為新筆記」（追加的會標上 ⚠，方便檢查）。
．取代現有筆記時，唯讀的筆記也會被取代。
．匯入後先瀏覽，沒問題按「確認無誤」，不對勁就按「復原之前的資料」。確認之前，筆記只能看、不能改。
．匯入視窗會告訴你備份存於什麼時間，以及按「取代」之後，現有的幾篇筆記會消失。
．自動備份的檔案就是備份檔，也可以匯入；手動匯出的檔案也能被指定成自動備份的檔案（會被新內容蓋掉）。
．要搬到另一台電腦：舊的匯出，新的匯入。到新電腦請先匯入，再指定自動備份，免得空的資料蓋掉備份檔。


【更新與單機版】
．這個工具放在網路上，每次打開網址就是最新版；確認或刷新版本請按 Ctrl＋F5。更新不會讓筆記消失。
．想離線使用：在網頁空白處按右鍵「另存新檔」，格式選「網頁，僅 HTML」，存起來按兩下就能開。單機版的資料和網址版是分開的，要互通請匯出再匯入；單機版不會自動更新，好處是離線電腦也可以使用。


【LOGO 裡的小機關】
點擊左上角 R note 的字母，可以開關各種小機關：
．R：防窺模式，內文變淡、一段時間不打字會整個畫面模糊。
．o：開啟游標周圍的光暈。
．t：內文打字的小碎石效果。
．e：顯示礦石展示櫃和錢袋（沒顯示時仍會默默累積）。
．n：把下方的封存區翻成「暗格」，一個藏筆記的地方（不是加密）。
o、t、e 的開關會被記住；R 和 n 每次重新開啟都是關閉。

  const DOC='<svg viewBox="0 0 48 48" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h16l10 10v28H12z"/><path d="M28 5v10h10"/><path d="M24 22v13M18.5 29.5L24 35l5.5-5.5"/></svg>';
  const LOCK='<svg viewBox="0 0 48 48" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="22" width="26" height="19" rx="4"/><path d="M16 22v-6a8 8 0 0 1 16 0v6"/></svg>';
  const NO='<svg viewBox="0 0 48 48" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><path d="M17 17l14 14M31 17L17 31"/></svg>';
  const FLD='<svg viewBox="0 0 24 20" width="20" height="17"><path d="M2 4a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  const dz=document.createElement('div');dz.id='dz';dz.innerHTML='<div id="dzs"></div><div id="dzb"></div>';document.body.appendChild(dz);
  const dzb=$('dzb'),D={on:false,depth:0,t:0,n:0,touched:false,inside:false,key:''};
  const isFile=e=>{const t=e.dataTransfer&&e.dataTransfer.types;return !!t&&Array.prototype.indexOf.call(t,'Files')>=0};
  const dzMode=()=>pend?'lock':(D.touched&&!D.inside)?'cancel':'ok';
  const dropSay=t=>{SM.list.filter(m=>m.id==='drop'&&!m.leaving).forEach(m=>retire(m,true));if(t)say(t,{lv:'wait',id:'drop'})};
  function dzDraw(){
    const mode=dzMode(),f=curF&&fById(curF),key=mode+(D.inside?1:0)+D.n+(f?f.id:'');
    if(key===D.key)return;
    D.key=key;
    dzb.className=(mode==='ok'?'':'g')+(D.inside&&mode!=='cancel'?' sol':'');
    const nm=f?(f.name.length>8?f.name.slice(0,8)+'…':f.name):'';
    let h,s,ctx='',ic,say1=null;
    if(mode==='lock'){ic=LOCK;h='匯入確認中，暫時不能新增筆記';s=['請先按「確認無誤」或「復原之前的資料」']}
    else if(mode==='cancel'){ic=NO;h='取消匯入';s=['放開滑鼠不會建立任何筆記','想繼續的話，把檔案拉回虛線框內'];say1='好，這次先不收，我不會建立筆記。'}
    else{ic=DOC;h='放開滑鼠，把文字文件變成筆記';s=['檔名會變成標題，內容會變成內文','可選多個檔案匯入'];if(f)ctx='<div class="dctx">'+FLD+'會放進『'+nm.replace(/</g,'&lt;')+'』資料夾</div>';say1=f?'放開手，這些會放進『'+nm+'』資料夾！':'放開手，我來把文字文件變成筆記！'}
    dzb.innerHTML=(mode!=='lock'&&D.n>0?'<div class="dchip">'+D.n+' 個檔案</div>':'')+ic+'<div class="dh1">'+h+'</div>'+s.map(x=>'<div class="dsb">'+x+'</div>').join('')+ctx;
    if(D.mode!==mode){D.mode=mode;dropSay(say1)}
  }
  function dzShow(e){
    D.on=true;D.touched=false;D.inside=false;D.key='';D.mode='';D.t=Date.now();
    let n=0;try{n=[].filter.call(e.dataTransfer.items||[],i=>i.kind==='file').length}catch(x){}
    D.n=n;dz.style.display='block';dzDraw();
  }
  function dzHide(){D.on=false;D.depth=0;D.key='';D.mode='';dz.style.display='none';dropSay(null)}
  function dzMove(e){
    const r=dzb.getBoundingClientRect(),ins=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(ins!==D.inside){D.inside=ins;if(ins)D.touched=true;dzDraw()}
  }
  document.addEventListener('dragenter',e=>{if(!isFile(e))return;e.preventDefault();e.stopPropagation();if(PH)return;D.depth++;if(!D.on)dzShow(e)},true);
  document.addEventListener('dragover',e=>{if(!isFile(e))return;e.preventDefault();e.stopPropagation();try{e.dataTransfer.dropEffect='copy'}catch(x){}if(PH)return;D.t=Date.now();if(!D.on)dzShow(e);dzMove(e)},true);
  document.addEventListener('dragleave',e=>{if(!isFile(e))return;e.stopPropagation();if(PH||!D.on)return;D.depth=Math.max(0,D.depth-1);if(D.depth===0||(!e.relatedTarget&&(e.clientX<=0||e.clientY<=0||e.clientX>=innerWidth||e.clientY>=innerHeight)))dzHide()},true);
  document.addEventListener('drop',e=>{
    if(!isFile(e))return;e.preventDefault();e.stopPropagation();if(PH)return;
    const files=[].slice.call(e.dataTransfer.files||[]),cancel=D.touched&&!D.inside;dzHide();
    if(pend){lockMsg();return}
    if(cancel){say('已取消匯入，沒有建立筆記。',{lv:'info',rx:'nod'});return}
    if(files.length)importFiles(files);
  },true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&D.on)dzHide()},true);
  setInterval(()=>{if(D.on&&Date.now()-D.t>1200)dzHide()},400);
  async function decodeText(f){
    const b=new Uint8Array(await f.arrayBuffer());let s;
    if(b[0]===0xFF&&b[1]===0xFE)s=new TextDecoder('utf-16le').decode(b);
    else if(b[0]===0xFE&&b[1]===0xFF)s=new TextDecoder('utf-16be').decode(b);
    else{
      if(b.indexOf(0)>=0)return null;
      try{s=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(x){try{s=new TextDecoder('big5').decode(b)}catch(y){return null}if(s.indexOf('�')>=0)return null}
    }
    {const bad=(s.match(/[\u0000-\u0008\u000E-\u001F]/g)||[]).length;if(bad>0&&bad/s.length>.005)return null}
    return s.replace(/^﻿/,'');
  }
  window.importFiles=async function(files){
    const MAXF=50,BIG=1000000,sk={ext:[],big:[],enc:[],full:[],more:files.slice(MAXF).map(f=>f.name)},ok=[];
    let size=JSON.stringify(S.notes).length;
    const bk=[];
    for(const f of files){
      if(!(/\.json$/i.test(f.name||'')||/json/.test(f.type||''))||f.size>IMPLIM)continue;
      try{const t=await decodeText(f);if(t===null)continue;const j=JSON.parse(t);if(j&&Array.isArray(j.notes)&&j.app==='R_note')bk.push(j)}catch(x){}
    }
    if(bk.length){
      if(files.length>1){playSfx('err');say('整批未匯入：其中包含備份檔，備份檔請單獨拖入。',{lv:'warn'});return}
      importJson(bk[0]);return;
    }
    for(const f of files.slice(0,MAXF)){
      const nm=f.name||'';
      if(/^(image|audio|video)\//.test(f.type)||/(pdf|zip|rar|7z|gzip|x-tar|msword|officedocument|ms-excel|ms-powerpoint|octet-stream)/.test(f.type)||/\.(png|jpe?g|gif|webp|bmp|ico|heic|tiff?|mp3|wav|ogg|flac|m4a|mp4|mov|avi|mkv|webm|pdf|zip|rar|7z|gz|tar|docx?|xlsx?|pptx?|exe|dll|psd|ase|aseprite)$/i.test(nm)){sk.ext.push(nm);continue}
      if(f.size>BIG){sk.big.push(nm);continue}
      let tx=null;try{tx=await decodeText(f)}catch(x){}
      if(tx===null){sk.enc.push(nm);continue}
      tx=tx.replace(/\r\n?/g,'\n');
      if(size+tx.length+400>IMPLIM){sk.full.push(nm);continue}
      size+=tx.length+400;ok.push({nm,tx});
    }
    const ids=[],prevSel=S.sel,fid=(curF&&fById(curF))?curF:null;
    if(ok.length){
      const now=Date.now(),mn=Math.min(0,...S.notes.filter(n=>!n.archived).map(n=>n.order));
      ok.forEach((m,i)=>{
        const base=m.nm.replace(/\.(txt|md|markdown|text|log)$/i,'').trim().replace(/\s+/g,'_').slice(0,80)||'未命名';
        const n={id:'n'+now+'u'+i+Math.random().toString(36).slice(2,5),title:uniq(base,null)||'未命名',content:m.tx,created:now,modified:now,archived:false,archivedAt:0,order:mn-(ok.length-i),icon:'📥'};
        if(fid)n.folderId=fid;
        S.notes.push(n);ids.push(n.id);
      });
      S.q='';$('sq').value='';ms.clear();playSfx('new');save();render();pick(ids[0]);{const el=document.querySelector('.item[data-id="'+ids[0]+'"]');if(el)el.scrollIntoView({block:'nearest'})}if(!PH){ta.focus();ta.setSelectionRange(0,0);ta.scrollTop=0}
      const undo=()=>{if(!ids.some(id=>byId(id)))return;S.notes=S.notes.filter(m=>!ids.includes(m.id));ms.clear();S.sel=(prevSel&&byId(prevSel))?prevSel:null;fixSel();sayOff('dropdone');playSfx('restore');save();render();showNote()};
      say('已建立 '+ids.length+' 篇筆記'+(fid?'，放在『'+fById(fid).name+'』資料夾':'')+'。',{lv:'info',id:'dropdone',hold:6000,rx:'ok',actions:[{label:'復原',fn:undo}]});
    }
    const RS={ext:'不是文字文件',big:'太大（上限 1 MB）',enc:'無法讀取內容',full:'會超出儲存空間',more:'超過一次 50 個的上限'};
    const keys=Object.keys(RS).filter(k=>sk[k].length),total=keys.reduce((a,k)=>a+sk[k].length,0);
    if(total){
      playSfx('err');
      const cut=s=>s.length>12?s.slice(0,12)+'…':s;
      const t=total===1?'『'+cut(sk[keys[0]][0])+'』'+RS[keys[0]]+'，已略過。':'略過 '+total+' 個檔案：'+keys.map(k=>sk[k].length+' 個'+RS[k]).join('、')+'。';
      say(t,{lv:'warn'});
    }
  };
})();
</script>

<script>
/* 多分頁防護（1.29）：別的分頁寫入筆記資料時，這個分頁停止存檔並鎖住，避免用舊資料蓋掉新資料。 */
(function(){
  const lock=()=>{if(stale)return;stale=true;clearTimeout(st);try{ta.blur();ta.readOnly=true}catch(e){}
    const o=document.getElementById('stl');o.classList.add('on');document.getElementById('stlr').onclick=()=>location.reload()};
  addEventListener('storage',e=>{if(e.key===KEY||e.key===null)lock()});
  window.staleLock=lock;
})();
</script>
